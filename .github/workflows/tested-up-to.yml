name: Tested up to

# Keeps "Tested up to" on WordPress.org current between releases, because the
# plugin directory stops search engines indexing a plugin that falls more than
# two major versions of WordPress behind. When a newer major version is out,
# the stable tag's tests run against it, and only if they pass is readme.txt
# changed in trunk and in the stable tag in WordPress.org SVN. That is a
# readme-only change with no new plugin version.
on:
  workflow_dispatch:
    inputs:
      dryrun:
        description: Run every step, even when the listing is current, but do not commit to SVN
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'

concurrency: tested-up-to

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  Check:
    name: Check the listing
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      tag: ${{ steps.check.outputs.tag }}
      wordpress: ${{ steps.check.outputs.wordpress }}
      options: ${{ steps.options.outputs.options }}
    steps:
      - name: Compare the listing with the latest WordPress
        id: check
        env:
          SVN_URL: ${{ vars.SVN_URL }}
          DRYRUN: ${{ inputs.dryrun || false }}
        run: |
          # "Tested up to" counts major versions only, such as 7.1.
          function Get-Major([string]$Version) {
              ($Version.Split('.') | Select-Object -First 2) -join '.'
          }

          $slug = Split-Path -Leaf $env:SVN_URL
          $tested = (Invoke-RestMethod "https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&request%5Bslug%5D=$slug").tested
          $latest = (Invoke-RestMethod 'https://api.wordpress.org/core/version-check/1.7/').offers `
              | Sort-Object -Property {[version]$_.version} -Bottom 1 `
              | Select-Object -ExpandProperty version
          # The directory reads the stable tag from trunk/readme.txt.
          $readme = Invoke-RestMethod "$env:SVN_URL/trunk/readme.txt"
          $tag = ([regex]'(?m)^Stable tag:\s*(\S+)').Match($readme).Groups[1].Value
          if (-not $tested -or -not $latest -or -not $tag) {
              throw "Could not read the listing '$tested', the latest WordPress '$latest' or the stable tag '$tag'"
          }

          $wordpress = Get-Major $latest
          $behind = [version](Get-Major $tested) -lt [version]$wordpress
          $proceed = $behind -or $env:DRYRUN -eq 'true'
          if ($behind) {
              Write-Host "The listing is tested up to $tested and WordPress $latest is out, so $tag will be tested against it."
          } elseif ($proceed) {
              Write-Host "The listing is tested up to $tested, which is current for WordPress $latest. A real run stops here, so this dry run carries on to prove the other steps."
          } else {
              Write-Host "The listing is tested up to $tested, which is current for WordPress $latest. Nothing to do."
          }

          "| Listing tested up to | Latest WordPress | Stable tag | Behind | Dry run |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| $tested | $latest | $tag | $behind | $env:DRYRUN |" >> $env:GITHUB_STEP_SUMMARY
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "wordpress=$wordpress" >> $env:GITHUB_OUTPUT
          "proceed=$("$proceed".ToLower())" >> $env:GITHUB_OUTPUT

      - name: Checkout the stable tag
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.check.outputs.tag }}
          sparse-checkout: ci

      - name: Read the test options
        id: options
        if: steps.check.outputs.proceed == 'true'
        run: |
          "options=$((Get-Content -Raw ci/options.json) -replace '\r?\n', '')" >> $env:GITHUB_OUTPUT

  Test:
    name: Test - ${{ matrix.options.Name }}
    needs: Check
    if: needs.Check.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        options: ${{ fromJSON(needs.Check.outputs.options) }}
    runs-on: ${{ matrix.options.Image }}
    timeout-minutes: 120
    steps:
      - name: Checkout Common
        uses: actions/checkout@v6
        with:
          repository: 51Degrees/common-ci

      - name: Install Runtime
        uses: ./.github/actions/install_runtime
        with:
          language: ${{ matrix.options.Language }}
          version: ${{ matrix.options.LanguageVersion }}

      # The build and test steps of common-ci's
      # nightly-pull-request.build-and-test.ps1, in the same order, run on the
      # stable tag. run-integration-tests.ps1 installs the latest WordPress.
      - name: Build and Test
        env:
          OPTIONS: ${{ toJSON(matrix.options) }}
          TAG: ${{ needs.Check.outputs.tag }}
          WORDPRESS: ${{ needs.Check.outputs.wordpress }}
          TEST_RESOURCE_KEY: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $org, $repo = $env:GITHUB_REPOSITORY.Split('/')
          $Options = ConvertFrom-Json -AsHashtable $env:OPTIONS
          $Options['RepoName'] = $repo
          $Options['Keys'] = @{ TestResourceKey = $env:TEST_RESOURCE_KEY }

          ./steps/clone-repo.ps1 -RepoName $repo -OrgName $org -Branch $env:TAG
          ./steps/run-script.ps1 ./$repo/ci/fetch-assets.ps1 $Options
          ./steps/run-script.ps1 ./$repo/ci/setup-environment.ps1 $Options
          ./steps/set-resource-keys.ps1 -Keys $Options['Keys']
          ./steps/run-script.ps1 ./$repo/ci/build-project.ps1 $Options
          ./steps/run-script.ps1 ./$repo/ci/run-unit-tests.ps1 $Options
          ./steps/run-script.ps1 ./$repo/ci/run-integration-tests.ps1 $Options

          # Without a resource key the integration tests skip WordPress, so
          # check they installed the version that "Tested up to" will name.
          $installed = ([regex]"\`$wp_version\s*=\s*'([^']+)'").Match(
              (Get-Content -Raw wp/wp-includes/version.php)).Groups[1].Value
          if ((($installed.Split('.') | Select-Object -First 2) -join '.') -ne $env:WORDPRESS) {
              throw "The tests installed WordPress '$installed', not $env:WORDPRESS"
          }
          Write-Host "$env:TAG passed its tests on WordPress $installed"

      - name: Report
        if: failure()
        env:
          TAG: ${{ needs.Check.outputs.tag }}
          WORDPRESS: ${{ needs.Check.outputs.wordpress }}
          NAME: ${{ matrix.options.Name }}
        run: |
          Write-Output "::error title=Not shown to work with WordPress $env:WORDPRESS::The tests of $env:TAG on $env:NAME failed or could not run, so Tested up to was not changed."

  Update:
    name: Update readme.txt in SVN
    needs: [ Check, Test ]
    runs-on: ubuntu-latest
    steps:
      - name: Update Tested up to
        env:
          SVN_URL: ${{ vars.SVN_URL }}
          SVN_USER: ${{ secrets.SVN_USER }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          TAG: ${{ needs.Check.outputs.tag }}
          WORDPRESS: ${{ needs.Check.outputs.wordpress }}
          DRYRUN: ${{ inputs.dryrun || false }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command svn -ErrorAction SilentlyContinue)) {
              sudo apt-get update -y
              sudo apt-get install -y --no-install-recommends subversion
          }

          # Only the two readme files are checked out. The plugin handbook asks
          # for a readme-only change in both trunk and the stable tag.
          $tagDir = "tags/$env:TAG"
          svn checkout -q --depth empty $env:SVN_URL svn
          Set-Location svn
          svn update -q --set-depth empty trunk tags
          svn update -q --set-depth empty $tagDir
          svn update -q trunk/readme.txt "$tagDir/readme.txt"

          $stable = ([regex]'(?m)^Stable tag:\s*(\S+)').Match(
              (Get-Content -Raw trunk/readme.txt)).Groups[1].Value
          if ($stable -ne $env:TAG) {
              throw "The stable tag is now '$stable', not the $env:TAG that was tested"
          }

          $regex = [regex]'(?m)^Tested up to:[^\r\n]*'
          foreach ($file in 'trunk/readme.txt', "$tagDir/readme.txt") {
              $path = Join-Path $PWD $file
              $text = [IO.File]::ReadAllText($path)
              if (-not $regex.IsMatch($text)) { throw "$file has no Tested up to line" }
              [IO.File]::WriteAllText($path, $regex.Replace($text, "Tested up to: $env:WORDPRESS", 1))
          }
          svn diff

          if (-not (svn status -q)) {
              $result = "readme.txt already says Tested up to: $env:WORDPRESS, so there is nothing to commit."
          } elseif ($env:DRYRUN -eq 'true') {
              $result = "Dry run, so Tested up to: $env:WORDPRESS was not committed to trunk and $tagDir."
          } else {
              svn commit --non-interactive --no-auth-cache `
                  --username $env:SVN_USER --password $env:SVN_PASSWORD `
                  -m "Tested up to $env:WORDPRESS (readme only)"
              $result = "Committed Tested up to: $env:WORDPRESS to trunk and $tagDir."
          }
          Write-Host $result
          $result >> $env:GITHUB_STEP_SUMMARY
